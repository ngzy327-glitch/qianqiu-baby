<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>大肥鱼 · 控制台</title>
    <!-- Telegram 官方 WebApp SDK(MIT, telegram.org 提供) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      2026-10-21 浏览器直开修复:
      原来 App 在 INIT(Telegram initData) 为空时直接显示「请从 Telegram 里打开」, 一个请求都不发,
      所以密码登录发的 Cookie 再有效也进不了控制台。
      现在: 先探 /api/whoami ——
        · Telegram 里打开(有 tgWebAppData / initData) → 原样加载;
        · 浏览器 + 已登录 Cookie → 给 WebApp.initData 填占位值, 让 App 正常渲染(真鉴权走后端 Cookie);
        · 浏览器 + 未登录 → 直接跳 /api/login。
      模块脚本在探测完成后动态插入, 保证 api.ts 读取 initData 时已经有值。
    -->
    <script>
      (function () {
        var h = location.hash || "", q = location.search || "";
        var tw = window.Telegram && window.Telegram.WebApp;
        var isTg = /tgWebAppData=/.test(h) || /[?&]init=/.test(q) || !!(tw && tw.initData);

        function boot() {
          var s = document.createElement("script");
          s.type = "module";
          s.crossOrigin = "anonymous";
          s.src = "./assets/index-D_OHC4wL.js";
          document.body.appendChild(s);
        }

        if (isTg) { boot(); return; }

        fetch("/api/whoami", { credentials: "same-origin" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || d.auth !== true) { location.replace("/api/login"); return; }
            try {
              if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.initData = "pwd";
              else window.Telegram = { WebApp: { initData: "pwd" } };
            } catch (e) {}
            boot();
          })
          .catch(function () { location.replace("/api/login"); });
      })();
    </script>
    <link rel="stylesheet" crossorigin href="./assets/index-pTnbCuJi.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
